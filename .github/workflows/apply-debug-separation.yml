name: Apply debug app separation

on:
  push:
    branches:
      - agent/debug-app-separation

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[debug-separation-applied]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/debug-app-separation

      - name: Apply guarded source changes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              content = file.read_text(encoding="utf-8")
              count = content.count(old)
              if count != 1:
                  raise SystemExit(f"Expected exactly one match in {path}, found {count}")
              file.write_text(content.replace(old, new, 1), encoding="utf-8")

          replace_once(
              "app/build.gradle",
              "        debug {\n            minifyEnabled false",
              "        debug {\n            applicationIdSuffix \".dev\"\n            resValue \"string\", \"app_name\", \"GPS Logger Dev\"\n\n            minifyEnabled false",
          )

          replace_once(
              "app/src/main/AndroidManifest.xml",
              'android:authorities="eu.basicairdata.graziano.gpslogger.fileprovider"',
              'android:authorities="${applicationId}.fileprovider"',
          )

          replace_once(
              "app/src/main/java/eu/basicairdata/graziano/gpslogger/GPSApplication.java",
              'FileProvider.getUriForFile(GPSApplication.getInstance(), "eu.basicairdata.graziano.gpslogger.fileprovider", file)',
              'FileProvider.getUriForFile(GPSApplication.getInstance(), BuildConfig.APPLICATION_ID + ".fileprovider", file)',
          )

          replace_once(
              "app/src/main/java/eu/basicairdata/graziano/gpslogger/AppDataManager.java",
              '    private String appDataRootFolder = "/data/data/eu.basicairdata.graziano.gpslogger";',
              '    private final String appDataRootFolder = GPSApplication.getInstance().getApplicationInfo().dataDir;',
          )
          PY

      - name: Commit guarded changes
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes required"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/build.gradle \
                  app/src/main/AndroidManifest.xml \
                  app/src/main/java/eu/basicairdata/graziano/gpslogger/GPSApplication.java \
                  app/src/main/java/eu/basicairdata/graziano/gpslogger/AppDataManager.java
          git commit -m "Separate debug application [debug-separation-applied]"
          git push origin HEAD:agent/debug-app-separation
